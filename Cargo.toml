[workspace]
resolver = "2"
members = [
    "crates/krama_cli",
    "crates/krama_core",
    "crates/krama_lexer",
    "crates/krama_macro",
    "crates/krama_parser",
    "crates/krama_runtime",
    "crates/krama_std",
]

[workspace.package]
authors = ["dannycreations"]
edition = "2021"
license = "GPL"
repository = "https://github.com/dannycreations/Krama"

[workspace.dependencies]
ahash = "0.8.12"
anyhow = "1.0.100"
ariadne = { version = "0.6.0", features = ["auto-color"] }
bumpalo = { version = "3.19.1", features = ["collections", "boxed"] }
clap = { version = "4.5.53", features = ["derive"] }
futures = "0.3.31"
inventory = "0.3.21"
krama_core = { path = "crates/krama_core" }
krama_lexer = { path = "crates/krama_lexer" }
krama_macro = { path = "crates/krama_macro" }
krama_parser = { path = "crates/krama_parser" }
krama_runtime = { path = "crates/krama_runtime" }
krama_std = { path = "crates/krama_std" }
once_cell = "1.21.3"
path-clean = "=1.0.1"
phf = { version = "0.13.1", features = ["macros"] }
proc-macro2 = "1.0.103"
quote = "1.0.42"
strum = "0.27.2"
strum_macros = "0.27.2"
syn = "2.0.111"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "fs", "io-util", "io-std", "signal"] }
walkdir = "=2.5.0"

[profile.dev]
codegen-units = 16
debug = 1
incremental = true

[profile.release]
codegen-units = 1
debug = "line-tables-only"
incremental = false
lto = true
opt-level = "z"
panic = "abort"
split-debuginfo = "packed"
